version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: phaigo-postgres
    restart: always
    ports:
      - "3456:5432"
    environment:
      POSTGRES_USER: phaigo
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: phaigo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
